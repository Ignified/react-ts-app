<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1, h2 {
      text-align: center;
    }

    form {
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
    }

    th {
      background-color: #f4f4f4;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo Management</h1>

    <!-- Login Form -->
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p id="loginError" class="error"></p>
    </form>

    <!-- Create Todo Form -->
    <h2>Create Todo</h2>
    <form id="createTodoForm">
      <input type="text" id="todoTitle" placeholder="Todo Title" required>
      <input type="text" id="todoDescription" placeholder="Todo Description" required>
      <button type="submit">Add Todo</button>
    </form>

    <!-- Todo List -->
    <h2>Todos</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Description</th>
          <th>Completed</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="todoList">
        <!-- Rows will be inserted here -->
      </tbody>
    </table>
  </div>

  <script>
    const apiBase = 'http://localhost:3001';
    let token = '';

    // Login Handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${apiBase}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (!response.ok) throw new Error('Invalid credentials');
        const data = await response.json();
        token = data.token;
        alert('Login successful!');
        fetchTodos();
      } catch (error) {
        document.getElementById('loginError').textContent = error.message;
      }
    });

    // Fetch Todos
    async function fetchTodos() {
      try {
        const response = await fetch(`${apiBase}/todos`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (!response.ok) throw new Error('Failed to fetch todos');
        const todos = await response.json();
        renderTodos(todos);
      } catch (error) {
        console.error(error);
        alert('Error fetching todos');
      }
    }

    // Render Todos
    function renderTodos(todos) {
      const todoList = document.getElementById('todoList');
      todoList.innerHTML = '';
      todos.forEach((todo) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${todo.id}</td>
          <td>${todo.title}</td>
          <td>${todo.description}</td>
          <td>${todo.completed ? 'Yes' : 'No'}</td>
          <td>
            <button onclick="deleteTodo(${todo.id})">Delete</button>
            <button onclick="updateTodo(${todo.id}, '${todo.title}', '${todo.description}', ${todo.completed})">Update</button>
          </td>
        `;
        todoList.appendChild(row);
      });
    }

    // Create Todo
    document.getElementById('createTodoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('todoTitle').value;
      const description = document.getElementById('todoDescription').value;

      try {
        const response = await fetch(`${apiBase}/todos`, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ title, description }),
        });

        if (!response.ok) throw new Error('Failed to create todo');
        fetchTodos();
        document.getElementById('createTodoForm').reset();
      } catch (error) {
        console.error(error);
        alert('Error creating todo');
      }
    });

    // Delete Todo
    async function deleteTodo(id) {
      try {
        const response = await fetch(`${apiBase}/todos/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` },
        });

        if (!response.ok) throw new Error('Failed to delete todo');
        fetchTodos();
      } catch (error) {
        console.error(error);
        alert('Error deleting todo');
      }
    }

    // Update Todo
    async function updateTodo(id, title, description, completed) {
      const newTitle = prompt('Enter new title:', title) || title;
      const newDescription = prompt('Enter new description:', description) || description;
      const newCompleted = confirm('Mark as completed?');

      try {
        const response = await fetch(`${apiBase}/todos/${id}`, {
          method: 'PUT',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ title: newTitle, description: newDescription, completed: newCompleted }),
        });

        if (!response.ok) throw new Error('Failed to update todo');
        fetchTodos();
      } catch (error) {
        console.error(error);
        alert('Error updating todo');
      }
    }
  </script>
</body>
</html>
