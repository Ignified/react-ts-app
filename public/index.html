<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product & Todo Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1, h2 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
    }

    th {
      background-color: #f4f4f4;
    }

    input, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
    }

    form {
      margin-bottom: 20px;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Product & Todo Manager</h1>

    <!-- Product List -->
    <h2>Product List</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Description</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="productList">
        <!-- Product rows will be added here -->
      </tbody>
    </table>

    <!-- Todo Manager -->
    <h2>Create Todo</h2>
    <form id="createTodoForm">
      <input type="text" id="todoTitle" placeholder="Todo Title" required>
      <input type="text" id="todoDescription" placeholder="Todo Description" required>
      <button type="submit">Add Todo</button>
    </form>

    <h2>Todos</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Description</th>
          <th>Completed</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="todoList">
        <!-- Todo rows will be added here -->
      </tbody>
    </table>
  </div>

  <script>
    const productApi = 'https://dummyjson.com/products';
    const todoApiBase = 'http://localhost:3001';
    let token = ''; // Replace with your token if needed

    // Fetch Products
    async function fetchProducts() {
      try {
        const response = await fetch(productApi);
        if (!response.ok) throw new Error('Failed to fetch products');
        const data = await response.json();
        renderProducts(data.products);
      } catch (error) {
        console.error('Error fetching products:', error);
        alert('Error fetching products');
      }
    }

    // Render Product List
    function renderProducts(products) {
      const productList = document.getElementById('productList');
      productList.innerHTML = '';

      products.forEach((product) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${product.id}</td>
          <td>${product.title}</td>
          <td>${product.description}</td>
          <td>$${product.price}</td>
        `;
        productList.appendChild(row);
      });
    }

    // Fetch Todos
    async function fetchTodos() {
      try {
        const response = await fetch(`${todoApiBase}/todos`, {
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        if (!response.ok) throw new Error('Failed to fetch todos');
        const todos = await response.json();
        renderTodos(todos);
      } catch (error) {
        console.error('Error fetching todos:', error);
        alert('Error fetching todos');
      }
    }

    // Render Todo List
    function renderTodos(todos) {
      const todoList = document.getElementById('todoList');
      todoList.innerHTML = '';

      todos.forEach((todo) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${todo.id}</td>
          <td>${todo.title}</td>
          <td>${todo.description}</td>
          <td>${todo.completed ? 'Yes' : 'No'}</td>
          <td>
            <button onclick="deleteTodo(${todo.id})">Delete</button>
            <button onclick="updateTodo(${todo.id}, '${todo.title}', '${todo.description}', ${todo.completed})">Update</button>
          </td>
        `;
        todoList.appendChild(row);
      });
    }

    // Create Todo
    document.getElementById('createTodoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('todoTitle').value;
      const description = document.getElementById('todoDescription').value;

      try {
        const response = await fetch(`${todoApiBase}/todos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token && { Authorization: `Bearer ${token}` }),
          },
          body: JSON.stringify({ title, description }),
        });
        if (!response.ok) throw new Error('Failed to create todo');
        fetchTodos();
        document.getElementById('createTodoForm').reset();
      } catch (error) {
        console.error('Error creating todo:', error);
        alert('Error creating todo');
      }
    });

    // Delete Todo
    async function deleteTodo(id) {
      try {
        const response = await fetch(`${todoApiBase}/todos/${id}`, {
          method: 'DELETE',
          headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        if (!response.ok) throw new Error('Failed to delete todo');
        fetchTodos();
      } catch (error) {
        console.error('Error deleting todo:', error);
        alert('Error deleting todo');
      }
    }

    // Update Todo
    async function updateTodo(id, title, description, completed) {
      const newTitle = prompt('Enter new title:', title) || title;
      const newDescription = prompt('Enter new description:', description) || description;
      const newCompleted = confirm('Mark as completed?');

      try {
        const response = await fetch(`${todoApiBase}/todos/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            ...(token && { Authorization: `Bearer ${token}` }),
          },
          body: JSON.stringify({ title: newTitle, description: newDescription, completed: newCompleted }),
        });
        if (!response.ok) throw new Error('Failed to update todo');
        fetchTodos();
      } catch (error) {
        console.error('Error updating todo:', error);
        alert('Error updating todo');
      }
    }

    // Fetch initial data
    fetchProducts();
    fetchTodos();
  </script>
</body>
</html>
